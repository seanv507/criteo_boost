[project]
name = "criteo-boost"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "altair>=6.2.2",
    "catboost>=1.2.10",
    "cupy-cuda13x>=14.1.1",
    "huggingface-hub>=1.21.0",
    "jupyter>=1.1.1",
    "lightgbm>=4.6.0",
    "pandas>=3.0.3",
    "polars>=2",
    "cudf-polars-cu13",
    "pyarrow>=24.0.0",
    "scikit-learn>=1.9.0",
    "wandb>=0.31",
    "wandb-workspaces>=0.4.5",
    "xgboost>=3.3.0",
    "xlsxwriter>=3.2.9",
    "vl-convert-python>=1.9.0.post1",
]

[dependency-groups]
dev = [
    "nbstripout>=0.9.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
target-version = "py314"
# criteo_analysis.ipynb / wandb_report.ipynb are preserved scratchpads with
# intentionally-broken cells (see the in-notebook warning notes) -- linting/
# formatting them would fight that, so they're excluded here. wandb.md is a
# saved reference doc (not maintained source) whose embedded ```python block
# ruff would otherwise reformat.
extend-exclude = ["criteo_analysis.ipynb", "wandb_report.ipynb", "wandb.md"]
